name: Emberfall Matched-Seed Balance Matrix

on:
  push:
    branches: [feat/emberfall-multi-policy-balance-lab]
    paths:
      - ci-trigger/run-policy-matrix.txt
  pull_request:
    branches: [implementation/emberfall-latest-source]
    paths:
      - app/src/main/java/com/example/engine/SimulationRunner.kt
      - app/src/test/java/com/example/engine/EmberfallEngineTest.kt
      - ci-trigger/run-policy-matrix.txt
  workflow_dispatch:
    inputs:
      seeds_per_class:
        description: Matched seeds per class for each of the 15 policy cells
        required: true
        default: '100'
        type: string

permissions:
  contents: read

concurrency:
  group: emberfall-policy-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-matrix:
    name: 5x3 matched-seed campaign matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMBERFALL_POLICY_MATRIX_SEEDS: ${{ inputs.seeds_per_class || '100' }}
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision Android SDK 36.1
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local-only build configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Run engine tests with matched-seed matrix enabled
        run: gradle :app:testDebugUnitTest --tests 'com.example.engine.EmberfallEngineTest' --no-daemon --stacktrace --console=plain

      - name: Upload matrix and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-matched-seed-policy-matrix
          if-no-files-found: warn
          path: |
            app/build/reports/emberfall-policy-matrix.csv
            app/build/test-results/testDebugUnitTest/
