name: Emberfall Agent Status

on:
  push:
    branches: [docs/emberfall-release-governance]
    paths: ['maestro/status-requests/*.json']
  workflow_dispatch:
    inputs:
      task_api_id:
        description: Copilot agent task ID from the dispatch receipt
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Load task ID
        id: packet
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK_ID: ${{ inputs.task_api_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t FILES < <(git diff --name-only HEAD^ HEAD -- 'maestro/status-requests/*.json')
            [[ "${#FILES[@]}" -eq 1 ]] || { echo "Expected one status request" >&2; exit 1; }
            ID=$(jq -r '.task_api_id' "${FILES[0]}")
          else
            ID="$INPUT_TASK_ID"
          fi
          [[ "$ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid task ID" >&2; exit 1; }
          echo "task_api_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Fetch Copilot task status
        env:
          TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          TASK_ID: ${{ steps.packet.outputs.task_api_id }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]] || { echo "::error::Missing COPILOT_AGENT_TOKEN secret"; exit 1; }
          CODE=$(curl --silent --show-error --output response.json --write-out '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Authorization: Bearer $TOKEN"             "https://api.github.com/agents/repos/grep999/Apo/tasks/$TASK_ID")
          cat response.json
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then echo "::error::Status lookup failed with HTTP $CODE"; exit 1; fi
          STATE=$(jq -r '.state // "unknown"' response.json)
          echo "## Copilot task status: $STATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Task ID: $TASK_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: emberfall-agent-status-${{ steps.packet.outputs.task_api_id }}
          retention-days: 30
          path: response.json
