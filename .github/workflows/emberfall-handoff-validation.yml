name: Emberfall Handoff and Maestro v0.3 Validation

on:
  pull_request:
    branches: [handoff/emberfall-coding-agent-v1.0]
    paths:
      - engineering/E00_REPOSITORY_SOURCE_BASELINE_2026-11-23.md
      - scripts/validate_emberfall_handoff.py
      - maestro/packets_v03/EFB-000-BASELINE.grounding.json
      - maestro/bootstrap_current_maestro.sh
      - .github/workflows/emberfall-handoff-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberfall-handoff-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e00-baseline:
    name: EFB-000 source inventory + Maestro v0.3 gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate commit and complete repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch legacy prototype branch for provenance inspection
        run: git fetch --no-tags origin +refs/heads/implementation/emberfall-latest-source:refs/remotes/origin/implementation/emberfall-latest-source

      - name: Bootstrap pinned Maestro v0.3.0
        run: |
          mkdir -p artifacts
          bash maestro/bootstrap_current_maestro.sh 2>&1 | tee artifacts/maestro-bootstrap.log

      - name: Validate Emberfall spec, WBS, ADR register and prototype provenance
        run: python scripts/validate_emberfall_handoff.py

      - name: Create EFB-000 Maestro workflow and seed grounding work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .maestro artifacts
          (
            cd "$GITHUB_WORKSPACE/../maestro"
            .venv/bin/maestro --db "$GITHUB_WORKSPACE/.maestro/state.sqlite3" coding-start \
              EMBERFALL \
              "EFB-000 repository, source inventory and build baseline" \
              "Establish authoritative v0.2 source, classify the legacy prototype, validate toolchain and evidence, and record build applicability." \
              --workspace "$GITHUB_WORKSPACE" --risk R1 --actor orchestrator \
              > "$GITHUB_WORKSPACE/.maestro/efb-000-start.json"
            START="$GITHUB_WORKSPACE/.maestro/efb-000-start.json"
            WID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$START")"
            REV="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["revision"])' "$START")"
            .venv/bin/maestro --db "$GITHUB_WORKSPACE/.maestro/state.sqlite3" coding-seed-work "$WID" --revision "$REV" \
              > "$GITHUB_WORKSPACE/.maestro/efb-000-seeded-work.json"
            .venv/bin/maestro --db "$GITHUB_WORKSPACE/.maestro/state.sqlite3" show "$WID" \
              > "$GITHUB_WORKSPACE/.maestro/efb-000-workflow-state.json"
          )

      - name: Run Maestro VERIFIED smoke gate on Apo handoff workspace
        working-directory: ${{ github.workspace }}/../maestro
        run: .venv/bin/maestro run-checks --workspace "$GITHUB_WORKSPACE" --preset smoke > "$GITHUB_WORKSPACE/artifacts/emberfall-handoff-gate-report.json"

      - name: Assert GateRunner evidence is VERIFIED and passed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("artifacts/emberfall-handoff-gate-report.json"),
          ]:
              rows = json.loads(path.read_text())
              assert rows, f"empty GateRunner report: {path}"
              for row in rows:
                  assert row["outcome"] == "passed", (path, row)
                  assert row["evidence_class"] == "VERIFIED", (path, row)
                  assert row["log_hash"], (path, row)
                  assert row["ran_on_sha"], (path, row)
          PY

      - name: Upload EFB-000 baseline and Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-efb-000-maestro-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            artifacts/
            .maestro/
