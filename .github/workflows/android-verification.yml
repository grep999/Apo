name: Emberfall Android Verification

on:
  push:
    branches: [implementation/emberfall-latest-source]
  pull_request:
    branches: [implementation/emberfall-latest-source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberfall-android-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-lint-package:
    name: Unit + Robolectric, lint, APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision Android SDK 36.1
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle 9.3.1 (wrapper bootstrap workaround)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local-only build configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Verify pure-JVM engine boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'import (android|androidx|dagger|hilt|com\\.example\\.(audio|data|ui))\\.' app/src/main/java/com/example/engine/; then
            echo 'Forbidden Android/framework import in pure-JVM engine.'
            exit 1
          fi

      - name: Run JVM, Room migration, audio DSP and Robolectric Compose tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run debug and release lint
        run: gradle :app:lintDebug :app:lintRelease --no-daemon --stacktrace --console=plain

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Create ephemeral CI-only release key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/emberfall-ci-upload.jks" \
            -storetype JKS -storepass "$CI_STORE_PASSWORD" -keypass "$CI_KEY_PASSWORD" \
            -alias upload -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Emberfall CI Verification'
        env:
          CI_STORE_PASSWORD: emberfall-ci-store-only
          CI_KEY_PASSWORD: emberfall-ci-key-only

      - name: Assemble release APK and AAB with ephemeral key
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --console=plain
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/emberfall-ci-upload.jks
          STORE_PASSWORD: emberfall-ci-store-only
          KEY_PASSWORD: emberfall-ci-key-only

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-test-reports
          if-no-files-found: warn
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/

      - name: Upload verification packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-verification-packages
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
