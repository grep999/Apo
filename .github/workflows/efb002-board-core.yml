name: Emberfall EFB-002 Board Core

on:
  pull_request:
    branches: [handoff/emberfall-coding-agent-v1.0]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/efb002-board-core.yml'
  push:
    branches: [feat/efb-002-board-core-victory]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberfall-efb002-board-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-jvm:
    name: Pure JVM compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify no Android dependencies in board domain
        run: |
          if grep -R -nE 'android\.|androidx\.|compose\.' src/main/kotlin; then
            echo 'Android/Compose dependency found in pure domain module' >&2
            exit 1
          fi
      - name: Run board-core tests
        run: gradle --no-daemon clean test
