name: Emberfall EFB-001 ADR Resolution Validation

on:
  pull_request:
    branches: [handoff/emberfall-coding-agent-v1.0]
    paths:
      - engineering/OPEN_DECISIONS.md
      - engineering/EFB-001_RULES_ADR_PROPOSALS.md
      - engineering/PRODUCT_OWNER_GOVERNANCE.md
      - engineering/PRODUCT_OWNER_DECISION_BASELINE.md
      - docs/adr/**
      - maestro/packets_v03/EFB-002-BOARD-CORE.grounding.json
      - maestro/packets_v03/EFB-CONTENT-001-SPECIALIST-PROPOSALS.grounding.json
      - scripts/validate_efb001_adr_proposals.py
      - .github/workflows/efb001-adr-proposal-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emberfall-efb-001-adr-resolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolution-contract:
    name: Validate Product Owner ADR resolutions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate resolved ADRs, traceability and implementation dependency
        run: python scripts/validate_efb001_adr_proposals.py

      - name: Upload resolution validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-efb-001-adr-resolution-validation
          if-no-files-found: warn
          path: artifacts/efb-001-adr-resolution-validation.json
